# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.2'
        cache-dependency-path: Chat_Server/go.sum

    # - name: Build
    #   run: go build -v ./...

    - name: Test
      working-directory: Chat_Server
      env:
        CONFIG_FILE: ${{ github.workspace }}/Chat_Server/config.yaml
      run: |
        cd Chat_Server/chat
        go test -v ./...
