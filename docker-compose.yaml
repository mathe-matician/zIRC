version: '3'
services:
  zirc_chat_server:
    container_name: zirc_chat_server
    # image: zirc_chat_server
    build:
      context: ./Chat_Server
      dockerfile: Dockerfile
    ports:
      - "6667:6667"

  zirc_auth_server:
    container_name: zirc_auth_server
    # image: zirc_auth_server
    build:
      context: ./Auth_Server
      dockerfile: Dockerfile
    ports:
      - "54666:54666"

  zirc_mongo:
    container_name: zirc_mongo
    image: mongo:7.0.12
    ports:
      - "27017:27017"
    volumes:
      - $HOME/mongo_chat:/data/db
      - ./Chat_Server/db/mongodb/dump:/dump
      - ./Chat_Server/db/mongodb/restore.sh:/docker-entrypoint-initdb.d/restore.sh

  zirc_postgres:
    container_name: zirc_postgres
    image: postgres:15.4
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - $HOME/pg_chat:/var/lib/postgresql/data
      - ./Chat_Server/db/postgres/pgdump.sql:/pgdump.sql
      - ./Chat_Server/db/postgres/restore.sh:/docker-entrypoint-initdb.d/restore.sh